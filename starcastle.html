<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Castle</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }

    #gameContainer {
      text-align: center;
    }

    #gameCanvas {
      border: 2px solid #333;
      background: #000;
    }

    #instructions {
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1024" height="1024"></canvas>
    <div id="instructions">
      WASD: Move/Rotate | Spacebar: Fire
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
