<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Castle</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }

    #gameContainer {
      text-align: center;
    }

    #gameCanvas {
      border: 2px solid #333;
      background: #000;
    }

    #instructions {
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1024" height="1024"></canvas>
    <div id="instructions">
      WASD: Move/Rotate | Spacebar: Fire
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas')
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl')

    if (!gl) {
      alert('WebGL not supported')
    }

    // Vertex shader source
    const vertex_shader_source = `
      attribute vec2 a_position;
      uniform vec2 u_resolution;
      uniform mat3 u_transform;

      void main() {
        vec2 position = (u_transform * vec3(a_position, 1.0)).xy;
        vec2 clipSpace = ((position / u_resolution) * 2.0) - 1.0;
        gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
      }
    `

    // Fragment shader source
    const fragment_shader_source = `
      precision mediump float;
      uniform vec4 u_color;

      void main() {
        gl_FragColor = u_color;
      }
    `

    const create_shader = (gl, type, source) => {
      const shader = gl.createShader(type)
      gl.shaderSource(shader, source)
      gl.compileShader(shader)

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader))
        gl.deleteShader(shader)
        return null
      }

      return shader
    }

    const create_program = (gl, vertexShader, fragmentShader) => {
      const program = gl.createProgram()
      gl.attachShader(program, vertexShader)
      gl.attachShader(program, fragmentShader)
      gl.linkProgram(program)

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Program link error:', gl.getProgramInfoLog(program))
        gl.deleteProgram(program)
        return null
      }

      return program
    }

    // Initialize WebGL
    const vertexShader = create_shader(gl, gl.VERTEX_SHADER, vertex_shader_source)
    const fragmentShader = create_shader(gl, gl.FRAGMENT_SHADER, fragment_shader_source)
    const program = create_program(gl, vertexShader, fragmentShader)

    // Get attribute and uniform locations
    const positionLocation = gl.getAttribLocation(program, 'a_position')
    const resolutionLocation = gl.getUniformLocation(program, 'u_resolution')
    const transformLocation = gl.getUniformLocation(program, 'u_transform')
    const colorLocation = gl.getUniformLocation(program, 'u_color')

    // Create buffer
    const positionBuffer = gl.createBuffer()

    // Game constants
    const CANVAS_SIZE = 1024
    const CENTER_X = CANVAS_SIZE / 2
    const CENTER_Y = CANVAS_SIZE / 2

    // Game state
    let keys_pressed = {}
    let lives = 3
    let round = 1
    let level = 1
    let explosions = []
    let game_over = true
    let game_started = false

    // Player state
    const player = {
      x: CENTER_X,
      y: CANVAS_SIZE - 100,
      angle: 0,
      vel_x: 0,
      vel_y: 0,
      thrust: false,
      size: 8,
      speed: 0,
      max_speed: 200,
      alive: true,
      respawn_timer: 0
    }

    // Castle rings
    const castle_rings = [
      { radius: 120, segments: 12, rotation: 0, rotationSpeed: 0.5, color: [0.0, 1.0, 0.0, 1.0] },
      { radius: 90, segments: 8, rotation: 0, rotationSpeed: -0.7, color: [0.0, 0.0, 1.0, 1.0] },
      { radius: 60, segments: 6, rotation: 0, rotationSpeed: 1.0, color: [1.0, 1.0, 0.0, 1.0] },
      // { radius: 30, segments: 4, rotation: 0, rotationSpeed: -1.5, color: [1.0, 0.0, 1.0, 1.0], faces: [] }
    ]

    // Initialize ring faces
    const init_ring_faces = () => {
      castle_rings.forEach(ring => {
        ring.faces = []
        for (let i = 0; i < ring.segments; i++) {
          ring.faces.push({
            index: i,
            destroyed: false
          })
        }
      })
    }

    init_ring_faces()

    // Projectiles
    const player_bullets = []

    // Enemies
    const enemies = []

    const init_game = () => {
      lives = 3
      round = 1
      level = 1
      game_over = false
      game_started = true
      explosions = []
      enemies.length = 0
      player_bullets.length = 0
      player.x = CANVAS_SIZE - 100
      player.y = CANVAS_SIZE - 100
      player.vel_x = 0
      player.vel_y = 0
      player.speed = 0
      player.angle = Math.atan2(CENTER_X - player.x, CENTER_Y - player.y)
      player.alive = true
      player.respawn_timer = 0
      init_ring_faces()
    }

    // Matrix helper functions
    const identity_matrix = () => [
      1, 0, 0,
      0, 1, 0,
      0, 0, 1
    ]

    const translate_matrix = (tx, ty) => [
      1, 0, 0,
      0, 1, 0,
      tx, ty, 1
    ]

    const rotate_matrix = (angle) => {
      const c = Math.cos(angle)
      const s = Math.sin(angle)
      return [
        c, s, 0,
        -s, c, 0,
        0, 0, 1
      ]
    }

    const multiply_matrices = (a, b) => [
      a[0] * b[0] + a[3] * b[1] + a[6] * b[2],
      a[1] * b[0] + a[4] * b[1] + a[7] * b[2],
      a[2] * b[0] + a[5] * b[1] + a[8] * b[2],
      a[0] * b[3] + a[3] * b[4] + a[6] * b[5],
      a[1] * b[3] + a[4] * b[4] + a[7] * b[5],
      a[2] * b[3] + a[5] * b[4] + a[8] * b[5],
      a[0] * b[6] + a[3] * b[7] + a[6] * b[8],
      a[1] * b[6] + a[4] * b[7] + a[7] * b[8],
      a[2] * b[6] + a[5] * b[7] + a[8] * b[8]
    ]

    // Drawing functions
    const draw_line = (x1, y1, x2, y2, transform, color) => {
      const vertices = new Float32Array([x1, y1, x2, y2])

      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer)
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW)

      gl.enableVertexAttribArray(positionLocation)
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0)

      gl.uniformMatrix3fv(transformLocation, false, transform)
      gl.uniform4f(colorLocation, color[0], color[1], color[2], color[3])

      gl.drawArrays(gl.LINES, 0, 2)
    }

    const draw_circle = (x, y, radius, segments, transform, color) => {
      const vertices = []
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2
        vertices.push(x + Math.cos(angle) * radius)
        vertices.push(y + Math.sin(angle) * radius)
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer)
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW)

      gl.enableVertexAttribArray(positionLocation)
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0)

      gl.uniformMatrix3fv(transformLocation, false, transform)
      gl.uniform4f(colorLocation, color[0], color[1], color[2], color[3])

      gl.drawArrays(gl.LINE_STRIP, 0, segments + 1)
    }

    const draw_ship = (x, y, angle, size, transform, color) => {
      const ship_transform = multiply_matrices(
        multiply_matrices(transform, translate_matrix(x, y)),
        rotate_matrix(angle)
      )

      // Ship triangle
      draw_line(0, -size, -size * 0.7, size, ship_transform, color)
      draw_line(-size * 0.7, size, size * 0.7, size, ship_transform, color)
      draw_line(size * 0.7, size, 0, -size, ship_transform, color)

      // Thrust flame
      if (player.thrust) {
        const flame_color = [1.0, 0.5, 0.0, 1.0]
        draw_line(0, size, -size * 0.3, size * 1.8, ship_transform, flame_color)
        draw_line(0, size, size * 0.3, size * 1.8, ship_transform, flame_color)
      }
    }

    const draw_castle = () => {
      const transform = identity_matrix()

      castle_rings.forEach(ring => {
        const segment_angle = (Math.PI * 2) / ring.segments

        ring.faces.forEach(face => {
          if (face.destroyed) return

          const start_angle = face.index * segment_angle + ring.rotation
          const end_angle = (face.index + 1) * segment_angle + ring.rotation

          const x1 = CENTER_X + Math.cos(start_angle) * ring.radius
          const y1 = CENTER_Y + Math.sin(start_angle) * ring.radius
          const x2 = CENTER_X + Math.cos(end_angle) * ring.radius
          const y2 = CENTER_Y + Math.sin(end_angle) * ring.radius

          draw_line(x1, y1, x2, y2, transform, ring.color)
        })
      })

      // Castle center
      draw_circle(CENTER_X, CENTER_Y, 15, 8, transform, [1.0, 0.0, 0.0, 1.0])
    }

    const draw_bullets = (bullets, color) => {
      const transform = identity_matrix()
      bullets.forEach(bullet => {
        draw_circle(bullet.x, bullet.y, 2, 4, transform, color)
      })
    }

    const draw_explosions = () => {
      const transform = identity_matrix()
      explosions.forEach(explosion => {
        const segments = 8
        const color = [1.0, 0.5, 0.0, 1.0 - (explosion.life / 0.8)]
        draw_circle(explosion.x, explosion.y, explosion.size, segments, transform, color)
      })
    }

    const draw_ui = () => {
      const transform = identity_matrix()

      // Draw lives as small ship graphics on the left
      for (let i = 0; i < lives; i++) {
        const ship_x = 30 + i * 25
        const ship_y = 30
        const ship_size = 8
        const ship_angle = 0
        draw_ship(ship_x, ship_y, ship_angle, ship_size, transform, [1.0, 1.0, 1.0, 1.0])
      }

      // Draw "ROUND:" label and number on the right
      const round_x = CANVAS_SIZE - 150
      const round_y = 25
      const digit_width = 8
      const digit_height = 12

      // Draw "R"
      draw_line(round_x, round_y, round_x, round_y + digit_height, transform, [1.0, 1.0, 1.0, 1.0])
      draw_line(round_x, round_y, round_x + digit_width, round_y, transform, [1.0, 1.0, 1.0, 1.0])
      draw_line(round_x + digit_width, round_y, round_x + digit_width, round_y + digit_height/2, transform, [1.0, 1.0, 1.0, 1.0])
      draw_line(round_x, round_y + digit_height/2, round_x + digit_width, round_y + digit_height/2, transform, [1.0, 1.0, 1.0, 1.0])
      draw_line(round_x, round_y + digit_height/2, round_x + digit_width, round_y + digit_height, transform, [1.0, 1.0, 1.0, 1.0])

      // Draw round number
      const round_num_x = round_x + 80
      const round_string = round.toString()
      for (let i = 0; i < round_string.length; i++) {
        const digit_x = round_num_x + i * (digit_width + 4)
        draw_line(digit_x, round_y, digit_x + digit_width, round_y, transform, [1.0, 1.0, 1.0, 1.0])
        draw_line(digit_x, round_y, digit_x, round_y + digit_height, transform, [1.0, 1.0, 1.0, 1.0])
        draw_line(digit_x + digit_width, round_y, digit_x + digit_width, round_y + digit_height, transform, [1.0, 1.0, 1.0, 1.0])
        draw_line(digit_x, round_y + digit_height, digit_x + digit_width, round_y + digit_height, transform, [1.0, 1.0, 1.0, 1.0])
      }

      // Draw "Press Spacebar to Start" when game over
      if (game_over) {
        draw_text("PRESS SPACEBAR TO START", CENTER_X, CENTER_Y + 200, 3, transform, [1.0, 1.0, 1.0, 1.0])
      }
    }

    // Letter definitions for WebGL line rendering
    const letter_strokes = {
      'P': [[0,0,0,1],[0,0,0.6,0],[0.6,0,0.6,0.5],[0.6,0.5,0,0.5]],
      'R': [[0,0,0,1],[0,0,0.6,0],[0.6,0,0.6,0.5],[0.6,0.5,0,0.5],[0.3,0.5,0.6,1]],
      'E': [[0,0,0,1],[0,0,0.6,0],[0,0.5,0.4,0.5],[0,1,0.6,1]],
      'S': [[0.6,0,0,0],[0,0,0,0.5],[0,0.5,0.6,0.5],[0.6,0.5,0.6,1],[0.6,1,0,1]],
      ' ': [],
      'A': [[0,1,0.3,0],[0.3,0,0.6,1],[0.1,0.6,0.5,0.6]],
      'C': [[0.6,0,0,0],[0,0,0,1],[0,1,0.6,1]],
      'B': [[0,0,0,1],[0,0,0.5,0],[0.5,0,0.6,0.1],[0.6,0.1,0.6,0.4],[0.6,0.4,0.5,0.5],[0.5,0.5,0,0.5],[0.5,0.5,0.6,0.6],[0.6,0.6,0.6,0.9],[0.6,0.9,0.5,1],[0.5,1,0,1]],
      'T': [[0,0,0.6,0],[0.3,0,0.3,1]],
      'O': [[0,0,0.6,0],[0.6,0,0.6,1],[0.6,1,0,1],[0,1,0,0]],
      'D': [[0,0,0,1],[0,0,0.5,0],[0.5,0,0.6,0.2],[0.6,0.2,0.6,0.8],[0.6,0.8,0.5,1],[0.5,1,0,1]],
      'F': [[0,0,0,1],[0,0,0.6,0],[0,0.5,0.4,0.5]],
      'G': [[0.6,0,0,0],[0,0,0,1],[0,1,0.6,1],[0.6,1,0.6,0.5],[0.6,0.5,0.3,0.5]],
      'H': [[0,0,0,1],[0.6,0,0.6,1],[0,0.5,0.6,0.5]],
      'I': [[0,0,0.6,0],[0.3,0,0.3,1],[0,1,0.6,1]],
      'J': [[0.6,0,0.6,1],[0.6,1,0,1],[0,1,0,0.7]],
      'K': [[0,0,0,1],[0.6,0,0,0.5],[0,0.5,0.6,1]],
      'L': [[0,0,0,1],[0,1,0.6,1]],
      'M': [[0,1,0,0],[0,0,0.3,0.5],[0.3,0.5,0.6,0],[0.6,0,0.6,1]],
      'N': [[0,1,0,0],[0,0,0.6,1],[0.6,1,0.6,0]],
      'Q': [[0,0,0.6,0],[0.6,0,0.6,1],[0.6,1,0,1],[0,1,0,0],[0.4,0.7,0.7,1.1]],
      'U': [[0,0,0,1],[0,1,0.6,1],[0.6,1,0.6,0]],
      'V': [[0,0,0.3,1],[0.3,1,0.6,0]],
      'W': [[0,0,0,1],[0,1,0.3,0.5],[0.3,0.5,0.6,1],[0.6,1,0.6,0]],
      'X': [[0,0,0.6,1],[0.6,0,0,1]],
      'Y': [[0,0,0.3,0.5],[0.6,0,0.3,0.5],[0.3,0.5,0.3,1]],
      'Z': [[0,0,0.6,0],[0.6,0,0,1],[0,1,0.6,1]]
    }

    const draw_text = (text, x, y, scale, transform, color) => {
      const char_width = 0.8 * scale * 6
      const char_height = scale * 6
      const total_width = text.length * char_width
      let cursor_x = x - total_width / 2

      for (const char of text) {
        const strokes = letter_strokes[char]
        if (strokes) {
          for (const stroke of strokes) {
            const x1 = cursor_x + stroke[0] * char_width
            const y1 = y + stroke[1] * char_height
            const x2 = cursor_x + stroke[2] * char_width
            const y2 = y + stroke[3] * char_height
            draw_line(x1, y1, x2, y2, transform, color)
          }
        }
        cursor_x += char_width
      }
    }

    // Game logic
    const update_player = (dt) => {
      // Handle respawn timer
      if (!player.alive) {
        player.respawn_timer -= dt
        if (player.respawn_timer <= 0) {
          if (lives > 0) {
            // Respawn player in random corner
            const corners = [
              { x: 50, y: 50 },
              { x: CANVAS_SIZE - 50, y: 50 },
              { x: 50, y: CANVAS_SIZE - 50 },
              { x: CANVAS_SIZE - 50, y: CANVAS_SIZE - 50 }
            ]
            const corner = corners[Math.floor(Math.random() * corners.length)]
            player.x = corner.x
            player.y = corner.y
            player.vel_x = 0
            player.vel_y = 0
            player.speed = 0
            // Face towards center
            player.angle = Math.atan2(CENTER_X - player.x, CENTER_Y - player.y)
            player.alive = true
          } else {
            // No lives left - game over
            game_over = true
          }
        }
        return // Don't process input when dead
      }

      // Block 1: Handle rotation
      const rotation_step = Math.PI / 8 // 22.5 degrees
      if (keys_pressed['a'] || keys_pressed['A']) {
        player.angle -= rotation_step * dt * 4
      }
      if (keys_pressed['d'] || keys_pressed['D']) {
        player.angle += rotation_step * dt * 4
      }

      // Block 2: Handle speed changes
      if (keys_pressed['w'] || keys_pressed['W']) {
        // Apply thrust in the direction the ship is facing
        const thrust_force = 300 * dt
        player.vel_x += Math.sin(player.angle) * thrust_force
        player.vel_y += -Math.cos(player.angle) * thrust_force
        player.thrust = true
      } else {
        player.thrust = false
      }

      // Handle deceleration with S key
      if (keys_pressed['s'] || keys_pressed['S']) {
        const current_speed = Math.sqrt(player.vel_x * player.vel_x + player.vel_y * player.vel_y)
        const new_speed = Math.max(current_speed - 400 * dt, 0)
        if (current_speed > 0) {
          const speed_ratio = new_speed / current_speed
          player.vel_x *= speed_ratio
          player.vel_y *= speed_ratio
        }
        player.speed = new_speed
      }

      // Calculate and limit speed
      const current_speed = Math.sqrt(player.vel_x * player.vel_x + player.vel_y * player.vel_y)
      if (current_speed > player.max_speed) {
        const speed_ratio = player.max_speed / current_speed
        player.vel_x *= speed_ratio
        player.vel_y *= speed_ratio
      }
      player.speed = Math.min(current_speed, player.max_speed)

      // Block 3: Apply velocity to player position
      player.x += player.vel_x * dt
      player.y += player.vel_y * dt

      // Keep player in bounds
      const margin = 20
      if (player.x < margin) {
        player.x = margin
        player.vel_x = Math.abs(player.vel_x) * 0.5
        player.speed *= 0.5
      }
      if (player.x > CANVAS_SIZE - margin) {
        player.x = CANVAS_SIZE - margin
        player.vel_x = -Math.abs(player.vel_x) * 0.5
        player.speed *= 0.5
      }
      if (player.y < margin) {
        player.y = margin
        player.vel_y = Math.abs(player.vel_y) * 0.5
        player.speed *= 0.5
      }
      if (player.y > CANVAS_SIZE - margin) {
        player.y = CANVAS_SIZE - margin
        player.vel_y = -Math.abs(player.vel_y) * 0.5
        player.speed *= 0.5
      }
    }

    const fire_bullet = (x, y, angle, speed, bullets) => {
      bullets.push({
        x: x,
        y: y,
        vel_x: Math.sin(angle) * speed,
        vel_y: -Math.cos(angle) * speed,
        life: 1000
      })
    }

    const update_bullets = (bullets, dt) => {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i]
        bullet.x += bullet.vel_x * dt
        bullet.y += bullet.vel_y * dt
        bullet.life -= dt * 1000

        if (bullet.life <= 0 ||
            bullet.x < 0 || bullet.x > CANVAS_SIZE ||
            bullet.y < 0 || bullet.y > CANVAS_SIZE) {
          bullets.splice(i, 1)
        }
      }
    }

    const spawn_enemy = () => {
      const ring_index = Math.floor(Math.random() * castle_rings.length)
      const ring = castle_rings[ring_index]
      const angle = Math.random() * Math.PI * 2
      enemies.push({
        x: CENTER_X + Math.cos(angle) * ring.radius,
        y: CENTER_Y + Math.sin(angle) * ring.radius,
        angle: 0,
        vel_x: 0,
        vel_y: 0,
        size: 6,
        jitter_timer: 0,
        jitter_x: 0,
        jitter_y: 0
      })
    }

    const check_collisions = (dt) => {
      // Check player bullets vs ring faces
      for (let i = player_bullets.length - 1; i >= 0; i--) {
        const bullet = player_bullets[i]
        let bullet_hit = false

        for (let ring of castle_rings) {
          if (bullet_hit) break

          const segment_angle = (Math.PI * 2) / ring.segments

          for (let face of ring.faces) {
            if (face.destroyed) continue

            const start_angle = face.index * segment_angle + ring.rotation
            const end_angle = (face.index + 1) * segment_angle + ring.rotation

            const x1 = CENTER_X + Math.cos(start_angle) * ring.radius
            const y1 = CENTER_Y + Math.sin(start_angle) * ring.radius
            const x2 = CENTER_X + Math.cos(end_angle) * ring.radius
            const y2 = CENTER_Y + Math.sin(end_angle) * ring.radius

            // Point to line segment distance check
            const line_dx = x2 - x1
            const line_dy = y2 - y1
            const line_length_sq = line_dx * line_dx + line_dy * line_dy

            let t = Math.max(0, Math.min(1, ((bullet.x - x1) * line_dx + (bullet.y - y1) * line_dy) / line_length_sq))
            const closest_x = x1 + t * line_dx
            const closest_y = y1 + t * line_dy

            const dist_x = bullet.x - closest_x
            const dist_y = bullet.y - closest_y
            const distance = Math.sqrt(dist_x * dist_x + dist_y * dist_y)

            if (distance < 8) {
              // Create explosion at midpoint of segment
              const mid_x = (x1 + x2) / 2
              const mid_y = (y1 + y2) / 2
              explosions.push({
                x: mid_x,
                y: mid_y,
                size: 0,
                maxSize: 15,
                life: 0.5
              })

              face.destroyed = true
              player_bullets.splice(i, 1)
              bullet_hit = true
              break
            }
          }
        }
      }

      // Check player bullets vs enemies
      for (let i = player_bullets.length - 1; i >= 0; i--) {
        const bullet = player_bullets[i]
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j]
          const dx = bullet.x - enemy.x
          const dy = bullet.y - enemy.y
          const distance = Math.sqrt(dx * dx + dy * dy)

          if (distance < enemy.size + 2) {
            // Create explosion
            explosions.push({
              x: enemy.x,
              y: enemy.y,
              size: 0,
              maxSize: 20,
              life: 0.5
            })

            // Remove bullet and enemy
            player_bullets.splice(i, 1)
            enemies.splice(j, 1)
            break
          }
        }
      }

      // Check player vs castle rings and center
      const player_center_dx = player.x - CENTER_X
      const player_center_dy = player.y - CENTER_Y
      const player_center_distance = Math.sqrt(player_center_dx * player_center_dx + player_center_dy * player_center_dy)

      // Check collision with castle center
      if (player.alive && player_center_distance < 15 + player.size) {
        // Player hit castle center
        explosions.push({
          x: player.x,
          y: player.y,
          size: 0,
          maxSize: 25,
          life: 0.8
        })
        lives--
        player.alive = false
        player.respawn_timer = 1.0

        // Make enemies retreat to center
        enemies.forEach(enemy => {
          const enemy_center_dx = CENTER_X - enemy.x
          const enemy_center_dy = CENTER_Y - enemy.y
          const enemy_center_distance = Math.sqrt(enemy_center_dx * enemy_center_dx + enemy_center_dy * enemy_center_dy)
          if (enemy_center_distance > 0) {
            enemy.vel_x = (enemy_center_dx / enemy_center_distance) * 100
            enemy.vel_y = (enemy_center_dy / enemy_center_distance) * 100
          }
        })
        return
      }

      // Check collision with castle rings
      for (let ring of castle_rings) {
        if (player.alive && Math.abs(player_center_distance - ring.radius) < player.size) {
          // Check if player is hitting an active face
          const segment_angle = (Math.PI * 2) / ring.segments
          const player_angle_from_center = Math.atan2(player.y - CENTER_Y, player.x - CENTER_X)
          const normalized_angle = ((player_angle_from_center - ring.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2)
          const face_index = Math.floor(normalized_angle / segment_angle)

          const face = ring.faces[face_index]
          if (face && !face.destroyed) {
            // Player hit ring
            explosions.push({
              x: player.x,
              y: player.y,
              size: 0,
              maxSize: 25,
              life: 0.8
            })
            lives--
            player.alive = false
            player.respawn_timer = 1.0

            // Make enemies retreat to center
            enemies.forEach(enemy => {
              const enemy_center_dx = CENTER_X - enemy.x
              const enemy_center_dy = CENTER_Y - enemy.y
              const enemy_center_distance = Math.sqrt(enemy_center_dx * enemy_center_dx + enemy_center_dy * enemy_center_dy)
              if (enemy_center_distance > 0) {
                enemy.vel_x = (enemy_center_dx / enemy_center_distance) * 100
                enemy.vel_y = (enemy_center_dy / enemy_center_distance) * 100
              }
            })
            return
          }
        }
      }

      // Check player vs enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i]
        const dx = player.x - enemy.x
        const dy = player.y - enemy.y
        const distance = Math.sqrt(dx * dx + dy * dy)

        if (player.alive && distance < player.size + enemy.size) {
          // Player hit - create explosion and respawn
          explosions.push({
            x: player.x,
            y: player.y,
            size: 0,
            maxSize: 25,
            life: 0.8
          })

          lives--
          player.alive = false
          player.respawn_timer = 1.0

          // Make enemies retreat to center
          enemies.forEach(enemy => {
            const enemy_center_dx = CENTER_X - enemy.x
            const enemy_center_dy = CENTER_Y - enemy.y
            const enemy_center_distance = Math.sqrt(enemy_center_dx * enemy_center_dx + enemy_center_dy * enemy_center_dy)
            if (enemy_center_distance > 0) {
              enemy.vel_x = (enemy_center_dx / enemy_center_distance) * 100
              enemy.vel_y = (enemy_center_dy / enemy_center_distance) * 100
            }
          })
          break
        }
      }
    }

    const update_explosions = (dt) => {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const explosion = explosions[i]
        explosion.life -= dt
        explosion.size = explosion.maxSize * (1 - explosion.life / (explosion.life + dt))

        if (explosion.life <= 0) {
          explosions.splice(i, 1)
        }
      }
    }

    const update_enemies = (dt) => {
      const player_is_target = player.alive && !game_over

      enemies.forEach((enemy, index) => {
        if (enemy.docked) {
          // Rotate with the ring
          const ring = castle_rings[enemy.dock_ring]
          enemy.dock_angle += ring.rotationSpeed * dt
          enemy.x = CENTER_X + Math.cos(enemy.dock_angle) * ring.radius
          enemy.y = CENTER_Y + Math.sin(enemy.dock_angle) * ring.radius
          enemy.angle = enemy.dock_angle + Math.PI / 2

          // Undock if player is alive and game active
          if (player_is_target) {
            enemy.docked = false
          }
          return
        }

        if (!player_is_target) {
          // Return to ring and dock
          if (!enemy.dock_ring) {
            enemy.dock_ring = Math.floor(Math.random() * castle_rings.length)
          }
          const ring = castle_rings[enemy.dock_ring]
          const angle_to_dock = Math.atan2(enemy.y - CENTER_Y, enemy.x - CENTER_X)
          const target_x = CENTER_X + Math.cos(angle_to_dock) * ring.radius
          const target_y = CENTER_Y + Math.sin(angle_to_dock) * ring.radius

          const dx = target_x - enemy.x
          const dy = target_y - enemy.y
          const distance = Math.sqrt(dx * dx + dy * dy)

          if (distance < 5) {
            // Dock to ring
            enemy.docked = true
            enemy.dock_angle = angle_to_dock
            enemy.x = target_x
            enemy.y = target_y
            enemy.vel_x = 0
            enemy.vel_y = 0
          } else {
            // Move towards dock position
            enemy.vel_x = (dx / distance) * 100
            enemy.vel_y = (dy / distance) * 100
            enemy.x += enemy.vel_x * dt
            enemy.y += enemy.vel_y * dt
            enemy.angle = Math.atan2(enemy.vel_y, enemy.vel_x) + Math.PI / 2
          }
          return
        }

        // Reset dock ring when pursuing
        enemy.dock_ring = null

        const dx = player.x - enemy.x
        const dy = player.y - enemy.y
        const distance_to_player = Math.sqrt(dx * dx + dy * dy)

        // Flocking behavior when far from player
        if (distance_to_player > 150) {
          // V formation - try to align with other drones
          let align_x = 0
          let align_y = 0
          let separate_x = 0
          let separate_y = 0
          let neighbors = 0

          enemies.forEach((other, other_index) => {
            if (index !== other_index && !other.docked) {
              const other_dx = other.x - enemy.x
              const other_dy = other.y - enemy.y
              const other_distance = Math.sqrt(other_dx * other_dx + other_dy * other_dy)

              // Separation - avoid overlap
              if (other_distance < 40 && other_distance > 0) {
                separate_x -= other_dx / other_distance
                separate_y -= other_dy / other_distance
              }

              // Alignment for V formation
              if (other_distance < 100) {
                align_x += other.vel_x
                align_y += other.vel_y
                neighbors++
              }
            }
          })

          // Apply flocking forces
          if (neighbors > 0) {
            align_x /= neighbors
            align_y /= neighbors
            enemy.vel_x += align_x * dt * 0.5
            enemy.vel_y += align_y * dt * 0.5
          }

          // Apply separation
          enemy.vel_x += separate_x * dt * 60
          enemy.vel_y += separate_y * dt * 60

          // Gentle movement towards player when in formation
          enemy.vel_x += (dx / distance_to_player) * 30 * dt
          enemy.vel_y += (dy / distance_to_player) * 30 * dt

        } else {
          // Ramming behavior when close to player
          enemy.jitter_timer -= dt
          if (enemy.jitter_timer <= 0) {
            enemy.jitter_x = (Math.random() - 0.5) * 30
            enemy.jitter_y = (Math.random() - 0.5) * 30
            enemy.jitter_timer = 0.2 + Math.random() * 0.3
          }

          // Aggressive movement towards player
          enemy.vel_x += (dx / distance_to_player) * 80 * dt
          enemy.vel_y += (dy / distance_to_player) * 80 * dt

          // Add jitter to velocity
          enemy.vel_x += enemy.jitter_x * dt
          enemy.vel_y += enemy.jitter_y * dt
        }

        // Apply drag
        enemy.vel_x *= 0.98
        enemy.vel_y *= 0.98

        // Update position
        enemy.x += enemy.vel_x * dt
        enemy.y += enemy.vel_y * dt

        // Update angle to face movement direction
        enemy.angle = Math.atan2(enemy.vel_y, enemy.vel_x) + Math.PI / 2
      })
    }

    // Event handlers
    let space_pressed = false

    document.addEventListener('keydown', (e) => {
      keys_pressed[e.key] = true

      // Handle spacebar
      if (e.key === ' ') {
        if (game_over) {
          init_game()
        } else if (!space_pressed && player.alive) {
          space_pressed = true
          fire_bullet(player.x, player.y, player.angle, 300, player_bullets)
        }
      }
    })

    document.addEventListener('keyup', (e) => {
      keys_pressed[e.key] = false

      if (e.key === ' ') {
        space_pressed = false
      }
    })

    // Initialize WebGL viewport
    gl.viewport(0, 0, CANVAS_SIZE, CANVAS_SIZE)
    gl.useProgram(program)
    gl.uniform2f(resolutionLocation, CANVAS_SIZE, CANVAS_SIZE)

    // Game loop
    let last_time = 0
    let enemy_spawn_timer = 3

    const game_loop = (current_time) => {
      const dt = (current_time - last_time) / 1000
      last_time = current_time

      // Spawn enemies with new logic
      enemy_spawn_timer -= dt
      if (enemy_spawn_timer <= 0) {
        const max_enemies = 3 + level
        if (enemies.length < max_enemies && Math.random() < 0.3) {
          spawn_enemy()
        }
        enemy_spawn_timer = 3
      }

      // Update castle rings rotation
      castle_rings.forEach(ring => {
        ring.rotation += ring.rotationSpeed * dt
      })

      // Update game objects
      update_player(dt)
      update_bullets(player_bullets, dt)
      update_enemies(dt)
      check_collisions(dt)
      update_explosions(dt)

      // Clear screen
      gl.clearColor(0, 0, 0, 1)
      gl.clear(gl.COLOR_BUFFER_BIT)

      // Draw everything
      const transform = identity_matrix()

      draw_castle()
      if (player.alive) {
        draw_ship(player.x, player.y, player.angle, player.size, transform, [1.0, 1.0, 1.0, 1.0])
      }

      enemies.forEach(enemy => {
        draw_ship(enemy.x, enemy.y, enemy.angle, enemy.size, transform, [1.0, 0.0, 1.0, 1.0])
      })

      draw_bullets(player_bullets, [1.0, 1.0, 0.0, 1.0])
      draw_explosions()
      draw_ui()

      requestAnimationFrame(game_loop)
    }

    // Initialize game
    enemy_spawn_timer = 3

    // Start game loop
    requestAnimationFrame(game_loop)
  </script>
</body>
